name: Windows EXE
on:
  push:
    branches: [codex/2gis-business-parser]
    paths:
      - 'desktop/**'
      - 'backend/app/**'
      - 'backend/requirements*'
      - 'frontend/**'
      - '.github/workflows/windows-exe.yml'
      - 'scripts/browser-fixture/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            desktop/requirements-build.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.lock -r desktop/requirements-build.txt
      - name: Backend tests
        run: python -m pytest -q
      - name: Build interface
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Build single-file EXE
        run: python -m PyInstaller --clean --noconfirm desktop/Parser.spec
      - name: Test packaged executable
        shell: python
        run: |
          import json, pathlib, subprocess, tempfile, hashlib, os, time, urllib.request
          executable = pathlib.Path('dist/2GIS-Business-Parser.exe').resolve()
          with tempfile.TemporaryDirectory(prefix='parser-build-check-') as folder:
              report = pathlib.Path(folder) / 'result.json'
              fixture = subprocess.Popen(['node','scripts/browser-fixture/server.mjs'], stdin=subprocess.PIPE)
              try:
                  ready=False
                  for _ in range(100):
                      try:
                          with urllib.request.urlopen('http://127.0.0.1:9334/json/version',timeout=.5): ready=True
                          break
                      except OSError: time.sleep(.2)
                  assert ready, 'Browser fixture did not start'
                  environment = dict(os.environ, DGIS_BROWSER_TEST_PORT='9334')
                  subprocess.run([str(executable), '--smoke-test', '--result', str(report)], check=True, timeout=120, env=environment)
              finally:
                  fixture.communicate(b'stop',timeout=20)
              result = json.loads(report.read_text(encoding='utf-8'))
              assert result['ok'] and result['frozen']
              assert result['matched'] == 10 and result['xlsx_rows'] == 10
              assert result['credential_storage'] == 'passed'
              assert result['tray_window'] == 'passed'
              assert result['browser_cdp'] == 'passed'
              pathlib.Path('dist/validation.json').write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')
          digest = hashlib.sha256(executable.read_bytes()).hexdigest()
          pathlib.Path('dist/SHA256SUMS.txt').write_text(digest + '  ' + executable.name + '\n', encoding='ascii')
          print('EXE bytes:', executable.stat().st_size)
      - name: Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: 2GIS-Business-Parser-Windows-x64
          path: |
            dist/2GIS-Business-Parser.exe
            dist/SHA256SUMS.txt
            dist/validation.json
          retention-days: 30
      - name: Publish downloadable EXE
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'windows-build-${{ github.run_number }}'
          $notes = @'
          Windows 10/11 x64. Download only 2GIS-Business-Parser.exe and double-click it.
          No Docker, Python, Node.js or bundled browser is required. Your default browser opens automatically.
          The application runs in the Windows tray. Use its menu to open the app or 2GIS, pause/resume a search, or exit. Closing the small control window hides it when the tray is available.
          Data is stored in %LOCALAPPDATA%\2GISBusinessParser. API keys are encrypted with Windows DPAPI.
          The packaged EXE was tested: demo search, XLSX export, encrypted credential storage, and native tray window lifecycle.
          Browser collection needs no API key and uses your installed Edge or Chrome. Enable it only within your separately obtained permission from 2GIS. CAPTCHA or an access restriction pauses the task for manual action; no bypass is included. The browser driver was tested against an isolated fixture with scrolling, card navigation and contact extraction.
          '@
          gh release create $tag --target '${{ github.sha }}' --title '2GIS Business Parser — Windows EXE' --notes $notes dist/2GIS-Business-Parser.exe dist/SHA256SUMS.txt dist/validation.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
